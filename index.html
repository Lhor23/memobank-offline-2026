<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MEMOBANK OFFLINE 2026</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f4f6f9;
      color: #1f2937;
    }

    header {
      background: #163b65;
      color: white;
      padding: 30px 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 28px;
    }

    header p {
      margin-top: 10px;
      font-size: 16px;
    }

    .container {
      max-width: 900px;
      margin: 30px auto;
      padding: 20px;
    }

    .search-box {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .search-box input {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
    }

    .memo-list {
      margin-top: 25px;
    }

    .memo-card {
      background: white;
      padding: 20px;
      margin-bottom: 15px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .memo-card h3 {
      color: #163b65;
      margin-top: 0;
    }

    .memo-card p {
      margin-bottom: 10px;
      color: #4b5563;
    }

    .memo-card a {
      display: inline-block;
      margin-top: 10px;
      padding: 10px 15px;
      background: #163b65;
      color: white;
      text-decoration: none;
      border-radius: 6px;
    }

    .memo-card a:hover {
      background: #245789;
    }

    #status {
      text-align: center;
      margin-top: 20px;
    }

    footer {
      text-align: center;
      padding: 20px;
      color: #6b7280;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <header>
    <h1>MEMOBANK OFFLINE 2026</h1>
    <p>School Memorandum Repository</p>
  </header>

  <div class="container">

    <div class="search-box">
      <input
        type="text"
        id="searchInput"
        placeholder="Search memorandum number or title..."
        oninput="searchMemos()"
      >
    </div>

    <div id="status">Loading memoranda...</div>

    <div class="memo-list">
      <div id="memoList"></div>
    </div>

  </div>

  <footer>
    MEMOBANK OFFLINE 2026 | School Memorandum Repository
  </footer>

  <script>

    const API_URL = "https://script.google.com/macros/s/AKfycbwVip6GcKobC-kjB20Mgw8ObJlg4lLDCoGHClP20sdc1zb6lYa9ezId4RGYr-V7yVFh/exec"; 

    let memos = [];

    async function loadMemos() {

      try {

        const response = await fetch(API_URL + "?t=" + Date.now());

        if (!response.ok) {
          throw new Error("Failed to connect to the server.");
        }

        const data = await response.json();

        memos = Array.isArray(data) ? data : [];

        document.getElementById("status").innerText =
          memos.length > 0 ? "" : "No memoranda found.";

        displayMemos(memos);

      } catch (error) {

        document.getElementById("status").innerText =
          "Unable to load memoranda. Please check your connection.";

        console.error(error);

      }

    }

    function displayMemos(list) {

      const memoList = document.getElementById("memoList");

      memoList.innerHTML = "";

      if (!list.length) {
        memoList.innerHTML = "<p>No matching memoranda found.</p>";
        return;
      }

      list.forEach(memo => {

        const card = document.createElement("div");

        card.className = "memo-card";

        const heading = document.createElement("h3");
        heading.textContent = memo.memoNumber || "No memorandum number";

        const title = document.createElement("p");
        title.textContent = memo.title || "No title provided";

        const year = document.createElement("p");
        year.textContent = memo.year || "";

        card.appendChild(heading);
        card.appendChild(title);
        card.appendChild(year);

        if (memo.fileId) {

          const link = document.createElement("a");

          link.href =
            "https://drive.google.com/file/d/" +
            encodeURIComponent(memo.fileId) +
            "/view";

          link.target = "_blank";
          link.rel = "noopener noreferrer";
          link.textContent = "Open Memorandum PDF";

          card.appendChild(link);

        }

        memoList.appendChild(card);

      });

    }

    function searchMemos() {

      const query = document
        .getElementById("searchInput")
        .value
        .toLowerCase()
        .trim();

      const filtered = memos.filter(memo => {

        const memoNumber = String(memo.memoNumber || "").toLowerCase();
        const title = String(memo.title || "").toLowerCase();
        const year = String(memo.year || "").toLowerCase();

        return memoNumber.includes(query) ||
               title.includes(query) ||
               year.includes(query);

      });

      displayMemos(filtered);

    }

    window.onload = loadMemos;

  </script>

</body>
</html>
