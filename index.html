<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MEMOBANK OFFLINE 2026</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f4f6f9;
      color: #1f2937;
    }

    header {
      background: #163b65;
      color: white;
      padding: 30px 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 28px;
    }

    header p {
      margin-top: 10px;
      font-size: 16px;
    }

    .container {
      max-width: 900px;
      margin: 30px auto;
      padding: 20px;
    }

    .search-box {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .search-box input {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      box-sizing: border-box;
      border: 1px solid #d1d5db;
      border-radius: 8px;
    }

    .memo-list {
      margin-top: 25px;
    }

    .memo-card {
      background: white;
      padding: 20px;
      margin-bottom: 15px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .memo-card h3 {
      color: #163b65;
      margin-top: 0;
    }

    .memo-card p {
      margin-bottom: 0;
      color: #4b5563;
    }

    footer {
      text-align: center;
      padding: 20px;
      color: #6b7280;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <header>
    <h1>MEMOBANK OFFLINE 2026</h1>
    <p>School Memorandum Repository</p>
  </header>

  <div class="container">

    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Search memorandum number or title..." oninput="searchMemos()">
    </div>

    <div class="memo-list">

    <div id="memoList"></div>

    </div>

  </div>

  <footer>
    MEMOBANK OFFLINE 2026 | School Memorandum Repository
  </footer>

  <script>
const API_URL = "https://script.google.com/macros/s/AKfycbwVip6GcKobC-kjB20Mwg8ObJlg4lLDCoGHClP20sdc1zb6lYa9ezId4RGYr-V7yVFh/exec";

let memos = [];

async function loadMemos() {
  try {
    const response = await fetch(API_URL);
    memos = await response.json();
    displayMemos(memos);
  } catch (error) {
    document.getElementById("memoList").innerHTML =
      "<p>Unable to load memoranda.</p>";
  }
function displayMemos(list) {
  const memoList = document.getElementById("memoList");

  memoList.innerHTML = "";

  list.forEach(memo => {
    const card = document.createElement("div");
    card.className = "memo-card";

    card.innerHTML = `
      <h3>${memo.memoNumber}</h3>
      <p>${memo.title || "No title provided"}</p>
      <p>${memo.year || ""}</p>
      <a href="https://drive.google.com/file/d/${memo.fileId}/view"
         target="_blank">Open Memorandum PDF</a>
    `;

    memoList.appendChild(card);
  });
function searchMemos() {
  const query = document.getElementById("searchInput").value.toLowerCase();

  const filtered = memos.filter(memo =>
    memo.memoNumber.toLowerCase().includes(query) ||
    (memo.title || "").toLowerCase().includes(query)
  );

  displayMemos(filtered);
}
</script>
  
</body>
</html>
